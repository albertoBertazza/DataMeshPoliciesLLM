version: '3.7'
services:
  # LDAP Server (OpenLDAP)
  ldap:
    image: osixia/openldap:latest
    container_name: ldap
    environment:
      LDAP_ORGANISATION: "MyOrg"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_SEED_INTERNAL_LDIF_PATH: /ldif
    volumes:
        - ./ldap-bootstrap:/ldif
    ports:
      - "389:389"
      - "636:636"
    networks:
      - trino-network
    healthcheck:
      test: [ "CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=com' -w admin -b 'dc=example,dc=com' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ldap-init:
    image: osixia/openldap:1.5.0
    container_name: ldap-init
    depends_on:
      ldap:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for LDAP...';
        sleep 5;

        echo 'Enabling memberof module...';
        ldapmodify -Y EXTERNAL -H ldapi:/// <<EOF
        dn: cn=module{0},cn=config
        add: olcModuleLoad
        olcModuleLoad: memberof.la
        EOF
        
        echo 'Enabling memberof overlay...';
        ldapmodify -Y EXTERNAL -H ldapi:/// <<EOF
        dn: olcOverlay=memberof,olcDatabase={1}mdb,cn=config
        objectClass: olcOverlayConfig
        objectClass: olcMemberOf
        olcOverlay: memberof
        olcMemberOfRefInt: TRUE
        EOF
        
        echo 'memberof overlay enabled successfully!';
      "
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/v1/info" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - trino-network

  #ldap-micro-service:
  #  image: python:3.11-slim
  #  hostname: ldap-micro-service
  #  container_name: ldap-micro-service
  #  working_dir: /ldap
  #  volumes:
  #    - .:/ldap
  #  command: >
  #    sh -c "cd ldap &&
  #           pip install flask ldap3 &&
  #           flask run --host=0.0.0.0 --port=5000"
  #  environment:
  #    FLASK_APP: app.py
  #    FLASK_ENV: development
  #  ports:
  #    - "5000:5000"
  #  depends_on:
  #    ldap:
  #      condition: service_healthy
  #  networks:
  #    - trino-network


  trino-coordinator:
    image: 'trinodb/trino:480'
    hostname: trino-coordinator
    container_name: trino-coordinator
    ports:
      - '8080:8080'
    volumes:
      - ./etc:/etc/trino
    depends_on:
      ldap-init:
        condition: service_completed_successfully
    networks:
      - trino-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/v1/info" ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: 'postgres:11'
    container_name: postgres-hive
    expose:
      - '5432'
    ports:
      - '5431:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hive_db
    networks:
      - trino-network

  hive-metastore:
    image: 'my-hive-metastore:latest'
    hostname: hive-metastore
    container_name: hive-metastore
    user: root
    ports:
      - '9083:9083' # Metastore Thrift
    volumes:
      - ./conf/metastore-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/metastore-site.xml:ro
      - ./conf/core-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/core-site.xml:ro  # ← fix path
    environment:
      METASTORE_DB_HOSTNAME: postgres
      METASTORE_TYPE: postgres
    command: >
      bash -c "
        mkdir -p /opt/metastore_db &&
        chown -R hive:hive /opt/metastore_db || true &&
        exec /entrypoint.sh
      "
    depends_on:
      - postgres
      - minio-init
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - trino-network

  minio:
    image: 'minio/minio:latest'
    hostname: minio
    container_name: minio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server --console-address ":9001" /data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - trino-network

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./datasets:/datasets
    entrypoint: >
      /bin/sh -c "
        set -e;
      
        until mc alias set local http://minio:9000 minio minio123; do
          echo 'Waiting for MinIO...';
          sleep 2;
        done;

        mc mb -p local/warehouse || true;

        mc cp --recursive /datasets local/warehouse/;

        echo 'MinIO init completed';
      "
    restart: "no"
    networks:
      - trino-network

  trino-init:
    image: trinodb/trino:480
    container_name: trino-init
    depends_on:
      trino-coordinator:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

    volumes:
      - ./init:/init
      - ./state:/state

    entrypoint: ["/bin/bash", "/init/init.sh"]

    networks:
      - trino-network

  opa: # Open Policy Agent for authorization in the data mesh
    image: openpolicyagent/opa:latest
    container_name: opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=debug
      - /policy
    volumes:
      - ./opa:/policy
    ports:
      - "8181:8181"
    networks:
      - trino-network

volumes:
  minio-data:
    driver: local
  state:
networks:
  trino-network:
    driver: bridge
