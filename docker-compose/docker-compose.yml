version: '3.7'
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    hostname: keycloak
    command: start-dev --import-realm
    environment:
      KC_HOSTNAME: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
    ports:
      - "8081:8080"
    networks:
      - trino-network
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  trino-coordinator:
    image: 'trinodb/trino:480'
    hostname: trino-coordinator
    container_name: trino-coordinator
    ports:
      - '8080:8080'
      - '8443:8443' # needed for OAuth2
    volumes:
      - ./etc:/etc/trino
      - ./etc/keystore.jks:/etc/trino/keystore.jks
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - trino-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/v1/info" ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: 'postgres:11'
    container_name: postgres-hive
    expose:
      - '5432'
    ports:
      - '5431:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hive_db
    networks:
      - trino-network

  hive-metastore:
    image: 'my-hive-metastore:latest'
    hostname: hive-metastore
    container_name: hive-metastore
    user: root
    ports:
      - '9083:9083' # Metastore Thrift
    volumes:
      - ./conf/metastore-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/metastore-site.xml:ro
      - ./conf/core-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/core-site.xml:ro  # ← fix path
    environment:
      METASTORE_DB_HOSTNAME: postgres
      METASTORE_TYPE: postgres
    command: >
      bash -c "
        mkdir -p /opt/metastore_db &&
        chown -R hive:hive /opt/metastore_db || true &&
        exec /entrypoint.sh
      "
    depends_on:
      - postgres
      - minio-init
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - trino-network

  minio:
    image: 'minio/minio:latest'
    hostname: minio
    container_name: minio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server --console-address ":9001" /data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - trino-network

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./datasets:/datasets
    entrypoint: >
      /bin/sh -c "
        set -e;
      
        until mc alias set local http://minio:9000 minio minio123; do
          echo 'Waiting for MinIO...';
          sleep 2;
        done;

        mc mb -p local/warehouse || true;

        mc cp --recursive /datasets local/warehouse/;

        echo 'MinIO init completed';
      "
    restart: "no"
    networks:
      - trino-network

  trino-init:
    image: trinodb/trino:480
    container_name: trino-init
    depends_on:
      trino-coordinator:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

    volumes:
      - ./init:/init
      - ./state:/state

    entrypoint: ["/bin/bash", "/init/init.sh"]

    networks:
      - trino-network

  opa: # Open Policy Agent for authorization in the data mesh
    image: openpolicyagent/opa:latest
    container_name: opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=debug
      - /policy
    volumes:
      - ./opa:/policy
    ports:
      - "8181:8181"
    networks:
      - trino-network

volumes:
  minio-data:
    driver: local
  state:
networks:
  trino-network:
    driver: bridge
